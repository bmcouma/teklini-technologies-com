<!-- Newsletter Section -->
<section class="newsletter-section bg-primary text-white py-5">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-6">
                <h3 class="mb-3">Stay Updated with Tech Insights</h3>
                <p class="mb-0">Get the latest technology trends, tips, and updates delivered to your inbox.</p>
            </div>
            <div class="col-lg-6">
                <form class="newsletter-form d-flex gap-2" id="newsletterForm">
                    <input type="email" class="form-control" placeholder="Enter your email" required>
                    <button type="submit" class="btn btn-light">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
                <small class="text-white-50 mt-2 d-block">
                    We respect your privacy. Unsubscribe at any time.
                </small>
            </div>
        </div>
    </div>
</section>
